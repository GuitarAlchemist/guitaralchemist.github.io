<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar Tree — GuitarAlchemist</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    align-items: center;
    padding: 0 20px;
    z-index: 100;
    gap: 16px;
  }
  nav a {
    color: #58a6ff;
    text-decoration: none;
    font-size: 14px;
  }
  nav a:hover { text-decoration: underline; }
  nav .title {
    color: #c9d1d9;
    font-weight: 600;
    font-size: 16px;
  }
  nav .sep { color: #484f58; }
  #chart {
    width: 100vw;
    height: calc(100vh - 48px);
    margin-top: 48px;
  }
  .node circle {
    cursor: pointer;
    stroke-width: 2px;
  }
  .node text {
    font-size: 13px;
    fill: #c9d1d9;
  }
  .link {
    fill: none;
    stroke: #30363d;
    stroke-width: 1.5px;
  }
  .tooltip {
    position: absolute;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    color: #c9d1d9;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 320px;
    z-index: 200;
  }
  .tooltip .tt-name { font-weight: 600; margin-bottom: 4px; }
  .tooltip .tt-desc { color: #8b949e; margin-bottom: 4px; }
  .tooltip .tt-count { color: #58a6ff; font-size: 12px; }
  .legend {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 12px;
    z-index: 100;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }
  .instructions {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: #8b949e;
    z-index: 100;
  }
</style>
</head>
<body>

<nav>
  <a href="https://guitaralchemist.github.io">Home</a>
  <span class="sep">/</span>
  <a href="https://guitaralchemist.github.io#demos">Demos</a>
  <span class="sep">/</span>
  <span class="title">Grammar Tree</span>
</nav>

<div id="chart"></div>

<div class="tooltip" id="tooltip"></div>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:#f0883e"></div> core-</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#7289da"></div> music-</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#e06c75"></div> sci-</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#4cb050"></div> gov-</div>
  <div class="legend-item"><div class="legend-swatch" style="background:#c678dd"></div> human-</div>
</div>

<div class="instructions">Click nodes to expand / collapse</div>

<script>
const categoryColors = {
  "core-": "#f0883e",
  "music-": "#7289da",
  "sci-": "#e06c75",
  "gov-": "#4cb050",
  "human-": "#c678dd"
};

const grammarData = {
  name: "Grammars (19)",
  category: "root",
  children: [
    {
      name: "core- (3)", category: "core-",
      children: [
        { name: "meta-grammar", desc: "Self-governing grammar of grammars", productions: 12, category: "core-", repo: "Demerzel" },
        { name: "scientific-method", desc: "Universal PCFG for research cycles", productions: 18, category: "core-", repo: "Demerzel" },
        { name: "state-machines", desc: "8 state machines for driver, belief, PDCA, etc.", productions: 24, category: "core-", repo: "Demerzel" }
      ]
    },
    {
      name: "music- (4)", category: "music-",
      children: [
        { name: "theory", desc: "Scales, chords, progressions, keys", productions: 22, category: "music-", repo: "ga" },
        { name: "guitar-technique", desc: "Picking, fretting, stretching", productions: 16, category: "music-", repo: "ga" },
        { name: "musicology-analysis", desc: "Cultural analysis of musical works", productions: 14, category: "music-", repo: "ga" },
        { name: "satriani-advanced", desc: "Legato, tapping, whammy, exotic scales", productions: 20, category: "music-", repo: "ga" }
      ]
    },
    {
      name: "sci- (5)", category: "sci-",
      children: [
        { name: "acoustics-physics", desc: "Sound waves, harmonics, room acoustics", productions: 15, category: "sci-", repo: "Demerzel" },
        { name: "algorithms", desc: "Sorting, searching, graph theory", productions: 18, category: "sci-", repo: "Demerzel" },
        { name: "mathematical-proof", desc: "Proof strategies and logical reasoning", productions: 12, category: "sci-", repo: "Demerzel" },
        { name: "ml-pipelines", desc: "ML workflow: data, train, evaluate, deploy", productions: 20, category: "sci-", repo: "ix" },
        { name: "audio-engineering", desc: "Recording, mixing, mastering, spatial audio", productions: 16, category: "sci-", repo: "ga" }
      ]
    },
    {
      name: "gov- (3)", category: "gov-",
      children: [
        { name: "blind-spot-detection", desc: "Staleness, coverage, cognitive blind spots", productions: 10, category: "gov-", repo: "Demerzel" },
        { name: "bs-generators", desc: "10-domain BS generation AND detection", productions: 30, category: "gov-", repo: "Demerzel" },
        { name: "product-management", desc: "Roadmap, sprint, stakeholder communication", productions: 14, category: "gov-", repo: "Demerzel" }
      ]
    },
    {
      name: "human- (4)", category: "human-",
      children: [
        { name: "cognitive-science", desc: "Biases, heuristics, decision making", productions: 16, category: "human-", repo: "Demerzel" },
        { name: "futurology", desc: "Signals, scenarios, horizons", productions: 12, category: "human-", repo: "Demerzel" },
        { name: "philosophy", desc: "Arguments, dialectic, epistemology", productions: 14, category: "human-", repo: "Demerzel" },
        { name: "psychohistory", desc: "Statistical prediction, crisis anticipation", productions: 18, category: "human-", repo: "Demerzel" }
      ]
    }
  ]
};

const container = document.getElementById("chart");
const tooltip = document.getElementById("tooltip");
let width = container.clientWidth;
let height = container.clientHeight;

const svg = d3.select("#chart").append("svg")
  .attr("width", width)
  .attr("height", height);

const g = svg.append("g");

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.3, 3])
  .on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);

const root = d3.hierarchy(grammarData);
root.x0 = height / 2;
root.y0 = 0;

// Start with root expanded one level, children collapsed
root.children.forEach(collapse);

function collapse(d) {
  if (d.children) {
    d._children = d.children;
    d._children.forEach(collapse);
    d.children = null;
  }
}

const duration = 400;
let i = 0;

function getColor(d) {
  const cat = d.data.category;
  if (cat === "root") return "#c9d1d9";
  return categoryColors[cat] || "#c9d1d9";
}

function getGitHubUrl(d) {
  if (!d.data.repo) return null;
  const org = "https://github.com/GuitarAlchemist";
  return `${org}/${d.data.repo}`;
}

function update(source) {
  const treeLayout = d3.tree().size([height - 100, width - 300]);
  const treeData = treeLayout(root);

  const nodes = treeData.descendants();
  const links = treeData.links();

  // Normalize depth
  nodes.forEach(d => { d.y = d.depth * 220 + 120; });

  // Nodes
  const node = g.selectAll("g.node")
    .data(nodes, d => d.id || (d.id = ++i));

  const nodeEnter = node.enter().append("g")
    .attr("class", "node")
    .attr("transform", () => `translate(${source.y0},${source.x0})`)
    .on("click", (event, d) => {
      if (d.children) {
        d._children = d.children;
        d.children = null;
      } else if (d._children) {
        d.children = d._children;
        d._children = null;
      } else if (d.data.repo) {
        const url = getGitHubUrl(d);
        if (url) window.open(url, "_blank");
      }
      update(d);
    })
    .on("mouseenter", (event, d) => {
      let html = `<div class="tt-name">${d.data.name}</div>`;
      if (d.data.desc) html += `<div class="tt-desc">${d.data.desc}</div>`;
      if (d.data.productions) html += `<div class="tt-count">${d.data.productions} productions</div>`;
      if (d.data.repo) html += `<div class="tt-count">Repo: ${d.data.repo}</div>`;
      const childCount = (d.children || d._children || []).length;
      if (childCount > 0) html += `<div class="tt-count">${childCount} children</div>`;
      tooltip.innerHTML = html;
      tooltip.style.opacity = 1;
    })
    .on("mousemove", (event) => {
      tooltip.style.left = (event.pageX + 14) + "px";
      tooltip.style.top = (event.pageY - 14) + "px";
    })
    .on("mouseleave", () => {
      tooltip.style.opacity = 0;
    });

  nodeEnter.append("circle")
    .attr("r", 1e-6)
    .style("fill", d => (d._children ? getColor(d) : "#0d1117"))
    .style("stroke", d => getColor(d));

  nodeEnter.append("text")
    .attr("dy", "0.35em")
    .attr("x", d => (d.children || d._children) ? -14 : 14)
    .attr("text-anchor", d => (d.children || d._children) ? "end" : "start")
    .text(d => d.data.name);

  // Update
  const nodeUpdate = nodeEnter.merge(node);

  nodeUpdate.transition().duration(duration)
    .attr("transform", d => `translate(${d.y},${d.x})`);

  nodeUpdate.select("circle")
    .attr("r", 7)
    .style("fill", d => (d._children ? getColor(d) : "#0d1117"))
    .style("stroke", d => getColor(d));

  nodeUpdate.select("text")
    .attr("x", d => (d.children || d._children) ? -14 : 14)
    .attr("text-anchor", d => (d.children || d._children) ? "end" : "start");

  // Exit
  const nodeExit = node.exit().transition().duration(duration)
    .attr("transform", () => `translate(${source.y},${source.x})`)
    .remove();

  nodeExit.select("circle").attr("r", 1e-6);
  nodeExit.select("text").style("fill-opacity", 1e-6);

  // Links
  const link = g.selectAll("path.link")
    .data(links, d => d.target.id);

  const linkEnter = link.enter().insert("path", "g")
    .attr("class", "link")
    .attr("d", () => {
      const o = { x: source.x0, y: source.y0 };
      return diagonal(o, o);
    });

  const linkUpdate = linkEnter.merge(link);

  linkUpdate.transition().duration(duration)
    .attr("d", d => diagonal(d.source, d.target));

  link.exit().transition().duration(duration)
    .attr("d", () => {
      const o = { x: source.x, y: source.y };
      return diagonal(o, o);
    })
    .remove();

  // Stash old positions
  nodes.forEach(d => {
    d.x0 = d.x;
    d.y0 = d.y;
  });
}

function diagonal(s, d) {
  return `M ${s.y} ${s.x}
          C ${(s.y + d.y) / 2} ${s.x},
            ${(s.y + d.y) / 2} ${d.x},
            ${d.y} ${d.x}`;
}

// Initial render
update(root);

// Center initially
svg.call(zoom.transform, d3.zoomIdentity.translate(60, 0));

// Resize
window.addEventListener("resize", () => {
  width = container.clientWidth;
  height = container.clientHeight;
  svg.attr("width", width).attr("height", height);
  update(root);
});
</script>
</body>
</html>
