<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scale Explorer — Guitar Alchemist</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="brand">Guitar Alchemist</a>
      <div class="links">
        <a href="/">Home</a>
        <div class="dropdown">
          <button class="dropdown-toggle">Demos &#9662;</button>
          <div class="dropdown-menu">
            <a href="../scales/">Scale Explorer</a>
            <a href="../chords/">Chord Viewer</a>
            <a href="../progressions/">Progression Player</a>
            <a href="../circle-of-fifths/">Circle of Fifths</a>
            <a href="../fretboard/">Fretboard Visualizer</a>
          </div>
        </div>
        <a href="../../showcase/">Showcase</a>
        <a href="https://github.com/GuitarAlchemist" target="_blank">GitHub</a>
      </div>
    </div>
  </nav>

  <main class="container demo-page">
    <h1>Scale Explorer</h1>
    <p>Select a root note and scale type to see the notation and hear it played.</p>

    <div class="controls">
      <label for="root">Root:</label>
      <select id="root">
        <option value="C" selected>C</option>
        <option value="C#">C# / Db</option>
        <option value="D">D</option>
        <option value="Eb">Eb</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="F#">F# / Gb</option>
        <option value="G">G</option>
        <option value="Ab">Ab</option>
        <option value="A">A</option>
        <option value="Bb">Bb</option>
        <option value="B">B</option>
      </select>

      <label for="scaleType">Scale:</label>
      <select id="scaleType">
        <option value="major" selected>Major</option>
        <option value="natural_minor">Natural Minor</option>
        <option value="harmonic_minor">Harmonic Minor</option>
        <option value="melodic_minor">Melodic Minor</option>
        <option value="pentatonic_major">Pentatonic Major</option>
        <option value="pentatonic_minor">Pentatonic Minor</option>
        <option value="blues">Blues</option>
        <option value="dorian">Dorian</option>
        <option value="phrygian">Phrygian</option>
        <option value="lydian">Lydian</option>
        <option value="mixolydian">Mixolydian</option>
        <option value="aeolian">Aeolian</option>
        <option value="locrian">Locrian</option>
      </select>

      <button id="playBtn">&#9654; Play</button>
    </div>

    <div id="notation" class="vf-container"></div>

    <div id="scaleInfo" style="padding: 1rem; color: var(--text-muted);"></div>
  </main>

  <footer>
    <div class="container">
      <p><a href="https://github.com/GuitarAlchemist">GuitarAlchemist</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/vexflow@4/build/cjs/vexflow.js"></script>
  <script src="../../js/vexflow-renderer.js"></script>
  <script src="../../js/audio-engine.js"></script>
  <script>
    const rootSel = document.getElementById('root');
    const scaleSel = document.getElementById('scaleType');
    const playBtn = document.getElementById('playBtn');
    const infoDiv = document.getElementById('scaleInfo');

    function update() {
      const root = rootSel.value;
      const scaleType = scaleSel.value;
      GaRenderer.renderScale('notation', root, scaleType);

      const notes = GaRenderer.getScaleNotes(root, scaleType);
      const label = scaleType.replace(/_/g, ' ');
      infoDiv.textContent = `${root} ${label}: ${notes.map(n => n.name).join(' - ')}`;
    }

    rootSel.addEventListener('change', update);
    scaleSel.addEventListener('change', update);

    playBtn.addEventListener('click', () => {
      const root = rootSel.value;
      const scaleType = scaleSel.value;
      const notes = GaRenderer.getScaleNotes(root, scaleType);
      // Add octave note
      const ri = GaRenderer.NOTE_NAMES.indexOf(root.replace('b','').replace('#',''));
      const octaveFreq = AudioEngine.noteToFreq(root, 5);

      const sequence = notes.map(n => ({
        name: n.name,
        octave: n.octave,
        duration: 0.35
      }));
      sequence.push({ name: notes[0].name, octave: 5, duration: 0.5 });

      const freqs = sequence.map(n => AudioEngine.noteToFreq(n.name, n.octave));
      let delay = 0;
      freqs.forEach((f, i) => {
        setTimeout(() => AudioEngine.playNote(f, sequence[i].duration), delay);
        delay += sequence[i].duration * 1000;
      });
    });

    // Initial render
    update();
  </script>
</body>
</html>
